name: 一键全验

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.75

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "洪蒙 -> 道果树/构建物-域"

      - name: 一键全验 10 项
        run: bash 一键全验.sh
