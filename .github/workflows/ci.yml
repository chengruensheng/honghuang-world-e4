name: 一键全验

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: 一键全验 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.75
          components: rustfmt, clippy

      - name: 安装 PowerShell (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        uses: microsoft/powershell@v1
        with:
          pwsh: true

      - name: 缓存 cargo（target-dir = 道果树/构建物-域）
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: 格式检查 (cargo fmt --check)
        run: cargo fmt --all -- --check

      - name: 静态分析 (cargo clippy -D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 单元测试 (cargo test --workspace)
        run: cargo test --workspace --lib

      # 固定挂载点回归：规则-府 生成验证入口 example（真任务 --落盘 的真实执行载体）
      # --lib 不覆盖 example；此处显式编译+执行生成区占位测试，防云端漂移
      - name: 生成验证入口 example 测试
        run: cargo test -p guize_fu --example 生成验证入口

      # 一键全验 17 项按平台分叉：
      # - ubuntu：一键全验.sh 用 pwsh（microsoft/powershell 已装）
      # - windows：一键全验.ps1 用 Windows PowerShell 5.1 直接跑
      #   （runner 自带，无需装 pwsh；bash 调用在 windows runner 下不可靠）
      - name: 一键全验 17 项 (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bash ./一键全验.sh

      - name: 一键全验 17 项 (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./一键全验.ps1
