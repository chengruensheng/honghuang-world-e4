name: 一键全验

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: 一键全验 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.75
          components: rustfmt, clippy

      - name: 安装 PowerShell (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        uses: microsoft/powershell@v1
        with:
          pwsh: true

      - name: 缓存 cargo（target-dir = 道果树/构建物-域）
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: 格式检查 (cargo fmt --check)
        run: cargo fmt --all -- --check

      - name: 静态分析 (cargo clippy -D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 单元测试 (cargo test --workspace)
        run: cargo test --workspace --lib

      - name: 一键全验 17 项
        run: bash ./一键全验.sh
