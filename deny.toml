# cargo-deny 配置
# 决策锚：260826-2230 工程-DSH § 一键全验

[graph]
all-features = false

[advisories]
version = 2
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    # webpki-roots v0.26 / v1.0 (ureq 间接依赖)
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
# path 依赖无 version 字段（path 自身是唯一标识），视为合法"单版本"
wildcards = "allow"
highlight = "all"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# 工作空间 path 依赖：GitHub 本地 monorepo 内，不走外部源
allow-git = ["https://github.com/*"]
